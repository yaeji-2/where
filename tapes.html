<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>tapes</title>
    <link rel="icon" type="image/png" href="images/vhs-tape.png">

    <style>
        body {
            cursor: url("images/cursor.gif"), auto;
            background-image: url("images/nowyourelooking.png");
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 1);
            color: red;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-screen h1 {
            margin: 0;
        }

        .loading-screen button {
            margin-top: 20px;
            font-size: 16px;
            color: red;
            cursor: pointer;
            background-color: gray;
        }

        .tape-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 110px;
            margin: auto;
            position: absolute;
        }

        .tape-container img {
            width: 150px;
            height: 80px;
            cursor: pointer;
        }

        .video-container {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            padding: 20px;
            text-align: center;
        }

        .video-container video {
            width: 100%;
            height: auto;
        }

        .video-container .close-button {
            margin-top: 10px;
            padding: 10px;
            background-color: red;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        @media only screen and (max-width: 768px) {
            .tape-container {
                flex-direction: column;
                align-items: center;
                margin: auto;
                position: absolute;
                gap: 100px;
            }
        }
    </style>
</head>

<body>
    <div class="loading-screen" id="loadingScreen">
        <h1>THANK YOU FOR CLICKING ON ME</h1>
        <button id="welcomeButton">YOU'RE WELCOME</button>
    </div>

    <audio loop id="backgroundAudio" src="media/LISTEN.mp3" type="audio/mp3"></audio>

    <div class="tape-container">
        <img src="images/vhs-tape.png" data-video="media/WANGAN.mp4" alt="Tape 1">
        <img src="images/vhs-tape.png" data-video="media/YOURESOLOUD.mp4" alt="Tape 2">
        <img src="images/vhs-tape.png" data-video="media/THREE.mp4" alt="Tape 3">
        <img src="images/vhs-tape.png" data-video="media/coping.mp4" alt="Tape 4">
    </div>

    <div class="video-container" id="videoContainer">
        <video id="videoPlayer" controls></video>
        <button class="close-button" id="closeVideo">X</button>
    </div>

    <script>
        document.getElementById('welcomeButton').addEventListener('click', function () {
            document.getElementById('loadingScreen').style.display = 'none';
            const audio = document.querySelector('audio');
            if (audio) {
                audio.play().catch(error => {
                    console.error('Audio playback failed:', error);
                });
            }
        });
    
        const tapes = document.querySelectorAll('.tape-container img');
        const videoContainer = document.getElementById('videoContainer');
        const videoPlayer = document.getElementById('videoPlayer');
        const closeVideo = document.getElementById('closeVideo');
        const backgroundAudio = document.getElementById('backgroundAudio');
    
        const tapeViews = {
            'Tape 1': false,
            'Tape 2': false,
            'Tape 3': false,
            'Tape 4': false
        };
    
        tapes.forEach((tape, index) => {
            tape.addEventListener('click', function () {
                const videoSrc = this.getAttribute('data-video');
                videoPlayer.src = videoSrc;
                videoContainer.style.display = 'block';
                videoPlayer.play();
                if (backgroundAudio) {
                    backgroundAudio.pause();
                }
    
                tapeViews[`Tape ${index + 1}`] = true;
            });
        });
    
        closeVideo.addEventListener('click', function () {
            videoContainer.style.display = 'none';
            videoPlayer.pause();
    
            if (backgroundAudio) {
                backgroundAudio.play().catch(error => {
                    console.error('Audio playback failed:', error);
                });
            }
    
            if (Object.values(tapeViews).every(viewed => viewed === true)) {
                showFinalDialog();
            }
        });
    
        function showFinalDialog() {
            document.querySelector('.tape-container').style.display = 'none';
    
            const dialog = document.createElement('div');
            dialog.style.backgroundColor = 'black';
            dialog.style.color = 'red';
            dialog.style.position = 'fixed';
            dialog.style.top = '50%';
            dialog.style.left = '50%';
            dialog.style.transform = 'translate(-50%, -50%)';
            dialog.style.padding = '20px';
            dialog.style.zIndex = '3000';
            dialog.innerHTML = `
                <p>What's your name?</p>
                <input type="text" id="userName" />
                <button onclick="saveName()">Submit</button>
            `;
            document.body.appendChild(dialog);
        }
    
        function saveName() {
    const userName = document.getElementById('userName').value.trim();
    
    if (!userName) {
        alert("Please enter your name.");
        return;
    }

    fetch('https://script.google.com/macros/s/AKfycbzR5VDOYL8U3zsrCnijo9RZHqPp6p997hIJZJhfnYxvYDxp5EWS8uFuX1dQDr_HY_Ol/exec', {
    method: 'POST',
    mode: 'cors',
    headers: {
        'Content-Type': 'application/json',
    },
    body: JSON.stringify({ name: userName })
})

    .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        return response.json();
    })
    .then(data => {
        console.log('Success:', data);
        showFriendQuestion();
    })
    .catch((error) => {
        console.error('Error:', error);
        alert("There was an error saving your name.");
    });
}

        function showFriendQuestion() {
            document.body.innerHTML = '';
    
            const friendDialog = document.createElement('div');
            friendDialog.style.backgroundColor = 'black';
            friendDialog.style.color = 'red';
            friendDialog.style.position = 'fixed';
            friendDialog.style.top = '50%';
            friendDialog.style.left = '50%';
            friendDialog.style.transform = 'translate(-50%, -50%)';
            friendDialog.style.padding = '20px';
            friendDialog.style.zIndex = '3000';
            friendDialog.innerHTML = `
                <p>DON'T YOU LOVE BEING MY FRIEND?</p>
                <button onclick="window.location.href='yes.html'">Yes</button>
                <button onclick="window.location.href='no.html'">No</button>
            `;
            document.body.appendChild(friendDialog);
        }
    </script>    
</body>
</html>
